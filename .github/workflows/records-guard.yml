name: records-guard

# Runs the mechanical half of semantics-preserved-abstract on every PR that
# touches Markdown. The script decides; this only gives it somewhere to run
# that nobody has to remember to invoke.
#
# Note on what "refuses" means here: a failing check is visible on the PR, but
# it does not *block* a merge until this check is marked required in branch
# protection. That is deliberately left to the instructor — a guard that starts
# blocking merges the moment it lands is a change to how the repo gates work,
# and per ADR-009 that is not an agent's call to make.

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.claude/tools/records-guard.mjs'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard diffs against the merge base, so it needs real history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check records against the base branch
        run: node .claude/tools/records-guard.mjs "origin/${{ github.base_ref }}"
